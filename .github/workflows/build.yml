name: Build self-contained Gecko ChatGPT for iOS 14

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          brew install dpkg
          brew install ldid || true
      - name: Build self-contained rootful deb
        run: ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS14-Gecko-rootful
          path: build/*.deb
          compression-level: 0
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          DEB="$(ls build/*.deb | head -1)"
          TAG="v$VERSION"
          NOTES="Rootful iOS 14 ChatGPT client with a ChatGPT-style interface. ChatGPT Web opens by default through the bundled Gecko engine with no browser chrome or API key. Web conversations now appear directly under an OEM-style Recents section in the top-left menu, using the title ChatGPT assigns to each conversation. Recents are captured from Gecko's live tab state as well as browser history, persist between launches and can be searched from the menu. Native Chat remains selectable and its composer moves above the keyboard. Existing Reynard installations stay separate and untouched."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "ChatGPT iOS 14 v$VERSION" --notes "$NOTES"
          fi