name: Keep current release only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup_releases.sh
