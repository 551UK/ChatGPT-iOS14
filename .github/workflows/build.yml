name: Build self-contained Gecko ChatGPT for iOS 14

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          brew install dpkg
          brew install ldid || true
      - name: Build self-contained rootful deb
        run: ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS14-Gecko-rootful
          path: build/*.deb
          compression-level: 0
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '[:space:]')"

          # Never allow a re-run of an older workflow commit to replace a newer
          # release. Compare this checkout's VERSION with the VERSION currently
          # on main before touching GitHub Releases.
          git fetch origin main --depth=1
          MAIN_VERSION="$(git show origin/main:VERSION | tr -d '[:space:]')"
          if [ "$VERSION" != "$MAIN_VERSION" ]; then
            echo "Skipping stale release publish: workflow v$VERSION, main v$MAIN_VERSION"
            exit 0
          fi

          DEB="$(ls build/*.deb | head -1)"
          TAG="v$VERSION"
          NOTES="Removes the temporary web icon overlays and makes the top mic type a real dot directly through Gecko without opening the software keyboard."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
            gh release edit "$TAG" --title "ChatGPT iOS 14 v$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$DEB" --title "ChatGPT iOS 14 v$VERSION" --notes "$NOTES"
          fi

          # Keep only the current release and tag. Remove all older release history.
          for OLD_TAG in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$OLD_TAG" != "$TAG" ]; then
              gh release delete "$OLD_TAG" --cleanup-tag --yes
            fi
          done
