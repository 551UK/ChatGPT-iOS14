name: Build self-contained Gecko ChatGPT for iOS 14

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          brew install dpkg
          brew install ldid || true
      - name: Build self-contained rootful deb
        run: ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS14-Gecko-rootful
          path: build/*.deb
          compression-level: 0
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          DEB="$(ls build/*.deb | head -1)"
          TAG="v$VERSION"
          NOTES="Rootful iOS 14 ChatGPT client with a ChatGPT-style interface. v1.5.7 fixes Recents restoration without relying on ChatGPT exposing a /c/... URL. Each Recent is tied to the real persisted Gecko tab UUID, and tapping it now uses Reynard's own hidden tab-overview selection path to switch back to that exact Gecko tab/session. This restores the previous conversation itself, including after app relaunch when Reynard restores its saved tab state. Exact ChatGPT URLs are kept only as a fallback for older Recents whose original Gecko tab is gone. The old 'Chat still saving' loop is removed."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
            gh release edit "$TAG" --title "ChatGPT iOS 14 v$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$DEB" --title "ChatGPT iOS 14 v$VERSION" --notes "$NOTES"
          fi