name: Build self-contained Gecko ChatGPT for iOS 14

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          brew install dpkg
          brew install ldid || true
      - name: Build self-contained rootful deb
        run: ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS14-Gecko-rootful
          path: build/*.deb
          compression-level: 0
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          DEB="$(ls build/*.deb | head -1)"
          TAG="v$VERSION"
          NOTES="Rootful iOS 14 ChatGPT client with a ChatGPT-style interface. v1.5.5 replaces unreliable Gecko/browser-history Recents detection with local prompt capture: the first prompt sent from the ChatGPT composer is saved on-device and shown directly under Recents. A Clear Recents control is included in that section and only clears the local list. Startup now restores the last ChatGPT Gecko tab instead of creating another hidden tab every launch, and the previous one-second history polling has been removed to reduce extra Gecko work and improve coexistence with a separately installed Reynard. Native Chat remains selectable and its composer stays keyboard-safe."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "ChatGPT iOS 14 v$VERSION" --notes "$NOTES"
          fi