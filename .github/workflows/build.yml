name: Build rootful iOS 14 app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          brew install dpkg
          brew install ldid || true
      - name: Build rootful deb
        run: ./scripts/build.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-iOS14-rootful
          path: build/*.deb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          DEB="$(ls build/*.deb | head -1)"
          gh release view "v$VERSION" >/dev/null 2>&1 && gh release delete "v$VERSION" --cleanup-tag -y || true
          gh release create "v$VERSION" "$DEB" --title "ChatGPT iOS 14 v$VERSION" --notes "Rootful iOS 14 build."
